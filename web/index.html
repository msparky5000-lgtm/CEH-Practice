<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>CEH Practice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>CEH Practice</h1>
      <p>Mobile practice app</p>
    </header>

    <section id="home" class="panel active">
      <button id="startBtn" class="primary">Start Practice</button>
      <button id="randomBtn">Random 20 Questions</button>
      <p class="note">The desktop Python app remains unchanged. This is the phone-friendly web version.</p>
    </section>

    <section id="quiz" class="panel">
      <div class="topbar"><span id="progress"></span><span id="score"></span></div>
      <h2 id="question"></h2>
      <div id="answers"></div>
      <div class="actions">
        <button id="checkBtn" class="primary">Check Answer</button>
        <button id="nextBtn" disabled>Next</button>
      </div>
      <p id="feedback"></p>
    </section>

    <section id="results" class="panel">
      <h2>Results</h2>
      <p id="resultText"></p>
      <button id="againBtn" class="primary">Try Again</button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
